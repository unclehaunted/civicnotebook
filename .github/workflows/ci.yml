name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Cache do Gradle. O SDK Android já vem na imagem (ANDROID_HOME);
      # não há local.properties no CI.
      - uses: gradle/actions/setup-gradle@v6

      # Tokens de design, testes unitários, detekt e lint: o mesmo script que corre antes de cada commit.
      - name: Verificar
        run: scripts/verify.sh --stacktrace

      - name: Relatórios
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
